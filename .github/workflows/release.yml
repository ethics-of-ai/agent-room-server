# Builds, signs, notarizes, and publishes the macOS DMG for a tag. This file is
# maintained in the private repository under mirror/overlay/.github/workflows/
# and arrives here by sync. Release Please publishes stable tags; the private
# RC workflow publishes prerelease tags without moving public main.
# workflow_dispatch can rebuild an existing stable tag or make an unsigned smoke
# artifact. Published versioned RC assets remain immutable.
#
# Secrets (repository settings):
#   APPLE_DEVELOPER_ID_P12_BASE64   Developer ID Application certificate, .p12, base64
#   APPLE_DEVELOPER_ID_P12_PASSWORD Password of that .p12
#   APPLE_API_KEY_ID                App Store Connect API key id
#   APPLE_API_ISSUER_ID             App Store Connect API issuer id
#   APPLE_API_KEY_P8_BASE64         The API key .p8, base64
#   SPARKLE_PRIVATE_ED_KEY           Sparkle Ed25519 private seed exported by generate_keys
# Variables (repository settings):
#   SPARKLE_PUBLIC_ED_KEY            Matching Sparkle Ed25519 public key, base64
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (signed RC rebuilds are refused)
        required: true
        type: string
      unsigned:
        description: Build an unsigned smoke DMG as a workflow artifact only; publish nothing
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # The rolling RC appcast is shared by every RC tag, so all release jobs are
  # serialized to keep two valid builds from racing to update it.
  group: release
  cancel-in-progress: false

jobs:
  dmg:
    name: Apple Silicon DMG
    runs-on: macos-26
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Promotion to production updates is a reviewed source change. Keep this
      # disabled until the RC update runbook has passed end to end.
      STABLE_SPARKLE_UPDATE_CHANNEL: disabled
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve the version from the tag
        id: version
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag must look like vX.Y.Z, got $TAG" >&2; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          MARKETING="${VERSION%%-*}"
          PRERELEASE=false
          UPDATE_CHANNEL="$STABLE_SPARKLE_UPDATE_CHANNEL"
          if [[ "$VERSION" == *-* ]]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] \
              || { echo "prerelease tag must look like vX.Y.Z-rc.N, got $TAG" >&2; exit 1; }
            PRERELEASE=true
            UPDATE_CHANNEL=rc
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "update_channel=$UPDATE_CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Check the tag against the versions in the tree
        env:
          MARKETING: ${{ steps.version.outputs.marketing }}
        run: |
          set -euo pipefail
          # The version fields carry release-please annotations, so the line has
          # a trailing comment. Dots are escaped so 0.1.0 cannot match 0x1y0.
          ESCAPED="${MARKETING//./\\.}"
          grep -qE "^[[:space:]]*MARKETING_VERSION:[[:space:]]+${ESCAPED}([[:space:]]|$)" apps/macos/project.yml \
            || { echo "apps/macos/project.yml MARKETING_VERSION is not $MARKETING" >&2; exit 1; }
          grep -q "\"version\": \"$MARKETING\"" apps/backend/package.json \
            || { echo "apps/backend/package.json version is not $MARKETING" >&2; exit 1; }
          grep -q "backendVersion: \"$MARKETING\"" apps/backend/src/releaseInfo.ts \
            || { echo "apps/backend/src/releaseInfo.ts backendVersion is not $MARKETING" >&2; exit 1; }

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Select the newest Xcode 26 on the image
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen

      - name: Download the pinned Sparkle release tools
        if: ${{ !inputs.unsigned && steps.version.outputs.update_channel != 'disabled' }}
        id: sparkle_tools
        run: |
          set -euo pipefail
          SPARKLE_VERSION="2.9.6"
          SPARKLE_SHA256="52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192"
          ARCHIVE="$RUNNER_TEMP/Sparkle-$SPARKLE_VERSION.tar.xz"
          curl -fsSL \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" \
            -o "$ARCHIVE"
          echo "$SPARKLE_SHA256  $ARCHIVE" \
            | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          tar -xf "$ARCHIVE" -C "$RUNNER_TEMP/sparkle-tools"
          test -x "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast"
          echo "dir=$RUNNER_TEMP/sparkle-tools" >> "$GITHUB_OUTPUT"

      - name: Download the Node.js 24 LTS runtime to bundle
        id: node_runtime
        run: |
          set -euo pipefail
          BASE="https://nodejs.org/dist/latest-v24.x"
          curl -fsSLo SHASUMS256.txt "$BASE/SHASUMS256.txt"
          TARBALL="$(grep -o 'node-v24\.[0-9]*\.[0-9]*-darwin-arm64\.tar\.gz' SHASUMS256.txt | head -n 1)"
          test -n "$TARBALL"
          curl -fsSLo "$TARBALL" "$BASE/$TARBALL"
          grep " $TARBALL\$" SHASUMS256.txt | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/node-runtime"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/node-runtime" --strip-components 1
          test -x "$RUNNER_TEMP/node-runtime/bin/node"
          test -f "$RUNNER_TEMP/node-runtime/LICENSE"
          NODE_VERSION="${TARBALL#node-}"
          NODE_VERSION="${NODE_VERSION%-darwin-arm64.tar.gz}"
          echo "dir=$RUNNER_TEMP/node-runtime" >> "$GITHUB_OUTPUT"
          echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          rm -f "$TARBALL" SHASUMS256.txt

      - name: Import the Developer ID certificate and notary credentials
        if: ${{ !inputs.unsigned }}
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in P12_BASE64 P12_PASSWORD API_KEY_ID API_ISSUER_ID API_KEY_P8_BASE64; do
            [ -n "${!name}" ] || { echo "release credential $name is missing; add it to the repository or run with unsigned=true" >&2; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/agentroom-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          EXISTING="$(security list-keychains -d user | tr -d '" ')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')"
          test -n "$IDENTITY" || { echo "no Developer ID Application identity in the imported certificate" >&2; exit 1; }
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials agentroom-ci \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
          echo "AGENTROOM_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "AGENTROOM_NOTARY_PROFILE=agentroom-ci" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Configure Sparkle update signing
        if: ${{ !inputs.unsigned && steps.version.outputs.update_channel != 'disabled' }}
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          for name in SPARKLE_PRIVATE_ED_KEY SPARKLE_PUBLIC_ED_KEY; do
            [ -n "${!name}" ] || { echo "release credential $name is missing" >&2; exit 1; }
          done
          printf '%s\n' "$SPARKLE_PRIVATE_ED_KEY" \
            | node scripts/verify-sparkle-key-pair.mjs "$SPARKLE_PUBLIC_ED_KEY"
          echo "AGENTROOM_SPARKLE_PUBLIC_ED_KEY=$SPARKLE_PUBLIC_ED_KEY" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and package
        env:
          AGENTROOM_NODE_RUNTIME_DIR: ${{ steps.node_runtime.outputs.dir }}
          AGENTROOM_MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          AGENTROOM_BUILD_NUMBER: ${{ github.run_number }}
          AGENTROOM_SPARKLE_UPDATE_CHANNEL: ${{ inputs.unsigned && 'disabled' || steps.version.outputs.update_channel }}
          CI: "1"
        run: node scripts/package-macos.mjs

      # A rejected notarization surfaces as a stapler "Record not found", which
      # names the wrong step. Apple's per-issue report is the only thing that
      # says why, and the credentials to fetch it live only on this runner.
      - name: Report why notarization was rejected
        if: ${{ failure() && !inputs.unsigned && env.AGENTROOM_NOTARY_PROFILE != '' }}
        run: |
          set -uo pipefail
          ID="$(xcrun notarytool history --keychain-profile "$AGENTROOM_NOTARY_PROFILE" \
            --output-format json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["history"][0]["id"])' 2>/dev/null)"
          [ -n "$ID" ] || { echo "no notarization submission found for this account"; exit 0; }
          echo "Newest submission: $ID"
          xcrun notarytool log "$ID" --keychain-profile "$AGENTROOM_NOTARY_PROFILE" || true

      - name: Name the artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UNSIGNED: ${{ inputs.unsigned || false }}
          UPDATE_CHANNEL: ${{ steps.version.outputs.update_channel }}
          SPARKLE_TOOLS_DIR: ${{ steps.sparkle_tools.outputs.dir }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          OUT=build/distribution/macos
          DMG="AgentRoom-$VERSION-arm64.dmg"
          MANIFEST="AgentRoom-$VERSION-release.json"
          mv "$OUT/AgentRoom.dmg" "$OUT/$DMG"
          node scripts/generate-release-manifest.mjs \
            --output "$OUT/$MANIFEST" \
            --release-tag "$TAG" \
            --dmg-name "$DMG" \
            --architecture arm64
          SUMMED_FILES=("$DMG" "$MANIFEST")
          if [ "$UNSIGNED" != "true" ] && [ "$UPDATE_CHANNEL" != "disabled" ]; then
            UPDATES="$RUNNER_TEMP/sparkle-updates"
            mkdir -p "$UPDATES"
            cp "$OUT/$DMG" "$UPDATES/$DMG"
            printf '%s\n' "$SPARKLE_PRIVATE_ED_KEY" \
              | "$SPARKLE_TOOLS_DIR/bin/generate_appcast" \
                  --ed-key-file - \
                  --download-url-prefix "https://github.com/ethics-of-ai/agent-room-server/releases/download/$TAG/" \
                  --link "https://github.com/ethics-of-ai/agent-room-server/releases/tag/$TAG" \
                  --maximum-deltas 0 \
                  "$UPDATES"
            cp "$UPDATES/appcast.xml" "$OUT/appcast.xml"
            grep -q 'sparkle:edSignature=' "$OUT/appcast.xml" \
              || { echo "Sparkle left the update unsigned; check SPARKLE_PRIVATE_ED_KEY" >&2; exit 1; }
            grep -q "$DMG" "$OUT/appcast.xml" \
              || { echo "Sparkle appcast does not name $DMG" >&2; exit 1; }
            SUMMED_FILES+=(appcast.xml)
          fi
          (cd "$OUT" && shasum -a 256 "${SUMMED_FILES[@]}" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "dmg=$OUT/$DMG" >> "$GITHUB_OUTPUT"
          echo "manifest=$OUT/$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "appcast=$OUT/appcast.xml" >> "$GITHUB_OUTPUT"
          echo "sums=$OUT/SHA256SUMS.txt" >> "$GITHUB_OUTPUT"

      - name: Gatekeeper assessment of the packaged app
        if: ${{ !inputs.unsigned }}
        env:
          DMG: ${{ steps.artifacts.outputs.dmg }}
        run: |
          set -euo pipefail
          hdiutil attach "$DMG" -mountpoint "$RUNNER_TEMP/dmg" -nobrowse -quiet
          spctl -a -vv -t exec "$RUNNER_TEMP/dmg/AgentRoom.app"
          hdiutil detach "$RUNNER_TEMP/dmg" -quiet

      - uses: actions/upload-artifact@v7
        with:
          name: AgentRoom-${{ steps.version.outputs.version }}-arm64
          path: |
            build/distribution/macos/AgentRoom-*.dmg
            build/distribution/macos/AgentRoom-*-release.json
            build/distribution/macos/appcast.xml
            build/distribution/macos/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the GitHub release
        if: ${{ !inputs.unsigned }}
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.artifacts.outputs.dmg }}
          MANIFEST: ${{ steps.artifacts.outputs.manifest }}
          APPCAST: ${{ steps.artifacts.outputs.appcast }}
          SUMS: ${{ steps.artifacts.outputs.sums }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          UPDATE_CHANNEL: ${{ steps.version.outputs.update_channel }}
          NODE_VERSION: ${{ steps.node_runtime.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="Apple Silicon build, signed with Developer ID and notarized. Bundles Node.js $NODE_VERSION (darwin-arm64). Compatibility is recorded in the release manifest. Verify the release artifacts against SHA256SUMS.txt."
          # Spelled out rather than assembled into an array: this runs on a
          # macOS runner, whose bash is 3.2, where expanding an empty array
          # under `set -u` is an unbound-variable error.
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$PRERELEASE" = "true" ]; then
              echo "Versioned RC release $TAG already exists; refusing to replace immutable assets." >&2
              exit 1
            fi
            if [ "$UPDATE_CHANNEL" = "disabled" ]; then
              gh release delete-asset "$TAG" appcast.xml --yes > /dev/null 2>&1 || true
              gh release upload "$TAG" --clobber "$DMG" "$MANIFEST" "$SUMS"
            else
              gh release upload "$TAG" --clobber "$DMG" "$MANIFEST" "$APPCAST" "$SUMS"
            fi
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --verify-tag --generate-notes --notes "$NOTES" --prerelease "$DMG" "$MANIFEST" "$APPCAST" "$SUMS"
          elif [ "$UPDATE_CHANNEL" = "disabled" ]; then
            gh release create "$TAG" --verify-tag --generate-notes --notes "$NOTES" "$DMG" "$MANIFEST" "$SUMS"
          else
            gh release create "$TAG" --verify-tag --generate-notes --notes "$NOTES" "$DMG" "$MANIFEST" "$APPCAST" "$SUMS"
          fi

          # RC builds read this moving appcast; its enclosure still names the
          # immutable, versioned RC release above. Only the newest published RC
          # advances the alias.
          if [ "$UPDATE_CHANNEL" = "rc" ]; then
            LATEST_RC="$(gh release list --exclude-drafts --limit 1000 \
              --json tagName,isPrerelease,publishedAt \
              --jq '[.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-rc\\.[0-9]+$")))] | sort_by(.publishedAt) | reverse | .[0].tagName')"
            if [ "$LATEST_RC" = "$TAG" ]; then
              if gh release view rc > /dev/null 2>&1; then
                gh release upload rc --clobber "$APPCAST"
              else
                gh release create rc --target "$GITHUB_SHA" \
                  --title "AgentRoom release candidate update channel" \
                  --notes "Rolling signed appcast for AgentRoom release-candidate testers. Install a versioned RC release first." \
                  --prerelease "$APPCAST"
              fi
            else
              echo "Not moving the RC channel: newest published RC is $LATEST_RC"
            fi
          fi

      - name: Remove the signing keychain
        if: ${{ always() && env.SIGNING_KEYCHAIN != '' }}
        run: security delete-keychain "$SIGNING_KEYCHAIN"
