# Builds, signs, notarizes, and publishes the macOS DMG for a tag. This file is
# maintained in the private repository under mirror/overlay/.github/workflows/
# and arrives here by sync. The tag is created by the sync job when the same
# tag is pushed upstream; workflow_dispatch rebuilds an existing tag.
#
# Secrets (repository settings):
#   APPLE_DEVELOPER_ID_P12_BASE64   Developer ID Application certificate, .p12, base64
#   APPLE_DEVELOPER_ID_P12_PASSWORD Password of that .p12
#   APPLE_API_KEY_ID                App Store Connect API key id
#   APPLE_API_ISSUER_ID             App Store Connect API issuer id
#   APPLE_API_KEY_P8_BASE64         The API key .p8, base64
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (vX.Y.Z)
        required: true
        type: string
      unsigned:
        description: Build an unsigned smoke DMG as a workflow artifact only; publish nothing
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Apple Silicon DMG
    runs-on: macos-26
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve the version from the tag
        id: version
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag must look like vX.Y.Z, got $TAG" >&2; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          MARKETING="${VERSION%%-*}"
          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Check the tag against the versions in the tree
        env:
          MARKETING: ${{ steps.version.outputs.marketing }}
        run: |
          set -euo pipefail
          # The version fields carry release-please annotations, so the line has
          # a trailing comment. Dots are escaped so 0.1.0 cannot match 0x1y0.
          ESCAPED="${MARKETING//./\\.}"
          grep -qE "^[[:space:]]*MARKETING_VERSION:[[:space:]]+${ESCAPED}([[:space:]]|$)" apps/macos/project.yml \
            || { echo "apps/macos/project.yml MARKETING_VERSION is not $MARKETING" >&2; exit 1; }
          grep -q "\"version\": \"$MARKETING\"" apps/backend/package.json \
            || { echo "apps/backend/package.json version is not $MARKETING" >&2; exit 1; }
          grep -q "backendVersion: \"$MARKETING\"" apps/backend/src/releaseInfo.ts \
            || { echo "apps/backend/src/releaseInfo.ts backendVersion is not $MARKETING" >&2; exit 1; }

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Select the newest Xcode 26 on the image
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen

      - name: Download the Node.js 24 LTS runtime to bundle
        id: node_runtime
        run: |
          set -euo pipefail
          BASE="https://nodejs.org/dist/latest-v24.x"
          curl -fsSLo SHASUMS256.txt "$BASE/SHASUMS256.txt"
          TARBALL="$(grep -o 'node-v24\.[0-9]*\.[0-9]*-darwin-arm64\.tar\.gz' SHASUMS256.txt | head -n 1)"
          test -n "$TARBALL"
          curl -fsSLo "$TARBALL" "$BASE/$TARBALL"
          grep " $TARBALL\$" SHASUMS256.txt | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/node-runtime"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/node-runtime" --strip-components 1
          test -x "$RUNNER_TEMP/node-runtime/bin/node"
          test -f "$RUNNER_TEMP/node-runtime/LICENSE"
          NODE_VERSION="${TARBALL#node-}"
          NODE_VERSION="${NODE_VERSION%-darwin-arm64.tar.gz}"
          echo "dir=$RUNNER_TEMP/node-runtime" >> "$GITHUB_OUTPUT"
          echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          rm -f "$TARBALL" SHASUMS256.txt

      - name: Import the Developer ID certificate and notary credentials
        if: ${{ !inputs.unsigned }}
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in P12_BASE64 P12_PASSWORD API_KEY_ID API_ISSUER_ID API_KEY_P8_BASE64; do
            [ -n "${!name}" ] || { echo "secret for $name is missing; add it to the repository or run with unsigned=true" >&2; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/agentroom-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          EXISTING="$(security list-keychains -d user | tr -d '" ')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')"
          test -n "$IDENTITY" || { echo "no Developer ID Application identity in the imported certificate" >&2; exit 1; }
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials agentroom-ci \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
          echo "AGENTROOM_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "AGENTROOM_NOTARY_PROFILE=agentroom-ci" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and package
        env:
          AGENTROOM_NODE_RUNTIME_DIR: ${{ steps.node_runtime.outputs.dir }}
          AGENTROOM_MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          AGENTROOM_BUILD_NUMBER: ${{ github.run_number }}
          CI: "1"
        run: node scripts/package-macos.mjs

      - name: Name the artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUT=build/distribution/macos
          DMG="AgentRoom-$VERSION-arm64.dmg"
          mv "$OUT/AgentRoom.dmg" "$OUT/$DMG"
          (cd "$OUT" && shasum -a 256 "$DMG" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "dmg=$OUT/$DMG" >> "$GITHUB_OUTPUT"
          echo "sums=$OUT/SHA256SUMS.txt" >> "$GITHUB_OUTPUT"

      - name: Gatekeeper assessment of the packaged app
        if: ${{ !inputs.unsigned }}
        env:
          DMG: ${{ steps.artifacts.outputs.dmg }}
        run: |
          set -euo pipefail
          hdiutil attach "$DMG" -mountpoint "$RUNNER_TEMP/dmg" -nobrowse -quiet
          spctl -a -vv -t exec "$RUNNER_TEMP/dmg/AgentRoom.app"
          hdiutil detach "$RUNNER_TEMP/dmg" -quiet

      - uses: actions/upload-artifact@v7
        with:
          name: AgentRoom-${{ steps.version.outputs.version }}-arm64
          path: |
            build/distribution/macos/AgentRoom-*.dmg
            build/distribution/macos/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the GitHub release
        if: ${{ !inputs.unsigned }}
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.artifacts.outputs.dmg }}
          SUMS: ${{ steps.artifacts.outputs.sums }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          NODE_VERSION: ${{ steps.node_runtime.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="Apple Silicon build, signed with Developer ID and notarized. Bundles Node.js $NODE_VERSION (darwin-arm64). Verify the download against SHA256SUMS.txt."
          # Spelled out rather than assembled into an array: this runs on a
          # macOS runner, whose bash is 3.2, where expanding an empty array
          # under `set -u` is an unbound-variable error.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber "$DMG" "$SUMS"
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --verify-tag --generate-notes --notes "$NOTES" --prerelease "$DMG" "$SUMS"
          else
            gh release create "$TAG" --verify-tag --generate-notes --notes "$NOTES" "$DMG" "$SUMS"
          fi

      - name: Remove the signing keychain
        if: ${{ always() && env.SIGNING_KEYCHAIN != '' }}
        run: security delete-keychain "$SIGNING_KEYCHAIN"
