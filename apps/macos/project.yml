name: AgentRoomMac
options:
  bundleIdPrefix: dev.agentroom
settings:
  MARKETING_VERSION: 0.4.0 # x-release-please-version
  CURRENT_PROJECT_VERSION: 1
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  AgentRoomMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      PRODUCT_NAME: AgentRoom
      PRODUCT_MODULE_NAME: AgentRoomMac
      PRODUCT_BUNDLE_IDENTIFIER: dev.agentroom.AgentRoomMac
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      AGENTROOM_SPARKLE_FEED_URL: ""
      AGENTROOM_SPARKLE_PUBLIC_ED_KEY: ""
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: AgentRoomMac/Info.plist
    dependencies:
      - package: Sparkle
    sources:
      - path: AgentRoomMac
      - path: ../shared/AgentRoomClient/Sources/AgentRoomClient
        group: Shared/AgentRoomClient
  AgentRoomMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - AgentRoomMacTests
    dependencies:
      - target: AgentRoomMac
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.agentroom.AgentRoomMacTests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/AgentRoom.app/Contents/MacOS/AgentRoom
      BUNDLE_LOADER: $(TEST_HOST)
